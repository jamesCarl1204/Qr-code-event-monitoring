<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/studentPortal/styles.css">
     <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

   <div class="container">
       <nav class="nav-container">
        <div class="hero-name">regis</div>
        <button id="logout-btn">logout</button>
       </nav>

       <section class="main-container">
        <div class="sidebar-con">
            <ul class="sidebar">
                <li class="sidebar-item active"  data-target="home">Home</li>
                <li class="sidebar-item" data-target="scan">Scan</li>
            </ul>
        </div>

        <main class="main-section">

            <div class="view" id="view-home">
                <div class="student-info-con">
                    <div>
                    <h3>Welcome back</h3>
                    <h1 id="user-name">Juan Dela Cruz</h1>
                    </div>
                    <div>
                        <i class="fa-sharp-duotone fa-solid fa-qrcode"></i>
                    </div>
                </div>
                
                <div class="student-stat-con">
                    <div id="total-event-attended">
                        <i class="fa-solid fa-calendar"></i>
                        <h3>Total event Attended</h3>
                        <p id="attend-count"></p>
                    </div>
                </div>

            <div>
                <div class="recent-event">
                    <table class="recent-event-table">
                        <thead>
                            <tr>
                                <th>Event Name</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>venue</th>
                                <th>status</th>
                            </tr>
                            </tr>
                        </thead>
                        <tbody class="event-table-body"></tbody>
                    </table>
                </div>
            </div>
         </div>

         <div class="view" id="view-scan">
            <div class="qr-text">
                <h1>SCAN EVENT QR</h1>
                <h1>Point your camera at the event Qr to record your attendance</h1>
            </div>
            <div id="scan-cam">

            </div>
            <div>
                dejeirier<br>
                nej
            </div>
         </div>
         <div>
         
         </main>
       </section>
       
    </div>

    <script src="/studentPortal/script.js"></script>
</body>
</html>
