<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

   <div class="container">
      <nav class="nav-container">
          <div class="hero-name">Regis Marie College  <span id="user-name">User:</span></div>
          <div class="nav-button">
          <button class="create-event-btn">create class</button>
          <button id="logout-btn">logout</button>
          </div>
      </nav>

    <div class="main-container">
        <div class="sidebar-con">
                 <ul class="sidebar">
                    <li class="sidebar-item active" id="active">Dashboard</li>
                    <li class="sidebar-item">Events</li>
                    <li class="sidebar-item">Student</li>
                </ul>
        </div>

        <div class="main">
          <div class="stats-container" >
             <div class="stat-card">
                <p class="stat-labels">TOTAL EVENTS</p>
                <p class="stat-label">0</p>
             </div>

             <div class="stat-card">
                <p class="stat-label">TOTAL STUDENTS</p>
             </div>
            
             <div class="stat-card">
                <p class="stat-label">ATTENDANCE RATE</p>
             </div>
        </div>

        <section class="events-section">
            <div class="event-box-container">
             <div class="event-box" id="event-box">
                <ul>
                    <li>Tech seminar </li>
                    <li>oct 15</li>
                    <li>av</li>
                </ul>
                <div class="event-btns">
                    <a>View Attendance</a> <a>View qr</a>
                </div>
                </div>
            </div>
         </section>

        </div>
    </div>

    <div class="qr-code-container">
        <div id="qr-code">
        
        </div>
    </div>

    <div class="event-input-container">
        <div class="event-input" >
            <input id="event-name" placeholder="e nter event name">
            <input id="date" type="date">
            <input id="time" type="time">
            <input id="event-venue" placeholder="enter venue">
            <button id="create-sub">Create</button>
            <button id="cancel-btn">Cancel</button>
        </div>
    </div>

    <div class="attendance-container">
        <div id="attendance-table">
            <div id="table-back-btn">back</div>
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Scanned</th>
                </tr>
                </thead>
                <tbody id="attendance-body">
                </tbody>
            </table>
        </div>
    </div>
    </div>


    <script src="/adminPortal/script.js"></script>
</body>
</html>
